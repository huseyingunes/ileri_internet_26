# Ters vekil (reverse proxy): dış dünya yalnızca Nginx'i görür, uygulama iç ağda kalır.
# Birden çok uygulama konteyneri varsa (--scale uygulama=3) Docker DNS hepsine dağıtır.
upstream uygulama {
  server uygulama:3000;
  keepalive 32;
}

# HTTP → HTTPS yönlendirme + Let's Encrypt doğrulaması
server {
  listen 80;
  server_name haber10da.net www.haber10da.net;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://haber10da.net$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name haber10da.net www.haber10da.net;

  ssl_certificate     /etc/nginx/sertifikalar/live/haber10da.net/fullchain.pem;
  ssl_certificate_key /etc/nginx/sertifikalar/live/haber10da.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  if ($host = www.haber10da.net) { return 301 https://haber10da.net$request_uri; }

  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $request_id;
  proxy_set_header Connection        "";

  # Genel istekler
  location / {
    limit_req zone=genel burst=40 nodelay;
    proxy_pass http://uygulama;
  }

  # Yazı tipleri ve statik dosyalar uzun süre önbellekte
  location ~* ^/(fonts|css|js)/ {
    proxy_pass http://uygulama;
    proxy_cache api;
    proxy_cache_valid 200 1h;
    add_header X-Nginx-Onbellek $upstream_cache_status;
  }

  # Haber listesi: mikro önbellek. Uygulamanın Cache-Control başlığına uyar,
  # süresi dolmuş kopyayı arkada yenilerken sunmaya devam eder.
  location ~ ^/api/(haberler|kategoriler)(/|$) {
    limit_req zone=genel burst=40 nodelay;
    proxy_pass http://uygulama;
    proxy_cache api;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 5s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Nginx-Onbellek $upstream_cache_status;
  }

  location ~ ^/api/auth/(giris|kayit) {
    limit_req zone=giris burst=5 nodelay;
    proxy_pass http://uygulama;
  }

  # SSE: tamponlama kapalı, bağlantı uzun ömürlü
  location /api/canli/ {
    proxy_pass http://uygulama;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/asistan/ {
    limit_req zone=genel burst=10 nodelay;
    proxy_pass http://uygulama;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # WebSocket: HTTP bağlantısını yükselt
  location /ws {
    proxy_pass http://uygulama;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $baglanti_yukseltme;
    proxy_read_timeout 1h;
  }

  # Metrikler dışarıya kapalı; Prometheus iç ağdan doğrudan uygulamaya bağlanır
  location /api/metrics { deny all; }
}
