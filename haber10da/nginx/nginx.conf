worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;   # sürüm numarasını gizle

  log_format json escape=json '{"zaman":"$time_iso8601","ip":"$remote_addr","istek":"$request",'
                              '"durum":$status,"sure":$request_time,"ust_sure":"$upstream_response_time",'
                              '"onbellek":"$upstream_cache_status","istek_kimligi":"$request_id"}';
  access_log /var/log/nginx/access.log json;

  # Sıkıştırma
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Mikro önbellek: GET /api/haberler yanıtları 5 sn Nginx'te tutulur.
  # Ani trafikte uygulamaya saniyede yalnızca bir istek gider.
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=100m inactive=10m use_temp_path=off;

  # IP başına hız sınırı (uygulamadaki sınırın önünde ilk savunma hattı)
  limit_req_zone $binary_remote_addr zone=genel:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=giris:10m rate=10r/m;

  # WebSocket bağlantı yükseltmesi için
  map $http_upgrade $baglanti_yukseltme {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;
}
