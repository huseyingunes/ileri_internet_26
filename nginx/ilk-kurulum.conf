# İlk kurulum: henüz TLS sertifikası yokken yalnızca HTTP.
# 1) NGINX_SITE=ilk-kurulum.conf docker compose up -d
# 2) docker compose --profile tls run --rm certbot
# 3) .env içinden NGINX_SITE satırını silip: docker compose up -d nginx
upstream uygulama {
  server uygulama:3000;
}

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $baglanti_yukseltme;
    proxy_buffering off;
    proxy_pass http://uygulama;
  }
}
